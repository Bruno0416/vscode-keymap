pluginGroup=dev.bruno0416.vscodekeymap
pluginVersion=0.2.5

# JetBrains IntelliJ Platform Gradle Plugin 2.18.1 currently has a race in code instrumentation
# when Gradle configuration cache enables intra-project parallel task execution (JetBrains #2193).
# Keep it disabled until that upstream issue is fixed.
org.gradle.configuration-cache=false
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
