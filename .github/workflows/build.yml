name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Validate keymaps
        run: python3 scripts/validate_keymaps.py
      - name: Build plugin
        run: ./gradlew test verifyPluginProjectConfiguration verifyPluginStructure buildPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: build/distributions/*.zip
