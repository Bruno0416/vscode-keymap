name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Resolve version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Prepare keymaps
        run: |
          python3 scripts/update_vscode_defaults.py --best-effort
          python3 scripts/generate_keymaps.py
          python3 scripts/validate_keymaps.py
          python3 scripts/report_coverage.py

      - name: Test, verify and build
        run: |
          ./gradlew \
            --no-configuration-cache \
            test \
            verifyPluginProjectConfiguration \
            verifyPluginStructure \
            buildPlugin \
            -PpluginVersion="$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/distributions/*.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
